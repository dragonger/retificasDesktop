server.port=8443
# Escuta em todas as interfaces de rede (0.0.0.0) para o celular acessar via Wi-Fi.
server.address=0.0.0.0
spring.mvc.static-path-pattern=/**
spring.web.resources.static-locations=classpath:/static/

# HTTPS com certificado autoassinado — necessario para o navigator.share()
# (compartilhar PDF) funcionar no celular; navegadores exigem contexto seguro.
# Ao acessar pela primeira vez o celular vai avisar que o certificado nao e
# confiavel: e esperado (autoassinado, so para testes locais) - toque em
# "Avancado" > "Continuar mesmo assim" / "Visitar site".
server.ssl.enabled=true
server.ssl.key-store=classpath:keystore.p12
server.ssl.key-store-password=retifica123
server.ssl.key-store-type=PKCS12
server.ssl.key-alias=retifica
