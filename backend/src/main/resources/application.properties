# PORT: injetada pelo Railway em produção; local usa 8443.
server.port=${PORT:8443}
# Escuta em todas as interfaces de rede (0.0.0.0) para o celular acessar via Wi-Fi.
server.address=0.0.0.0
spring.mvc.static-path-pattern=/**
spring.web.resources.static-locations=classpath:/static/

# HTTPS com certificado autoassinado — necessario localmente para o
# navigator.share() (compartilhar PDF) funcionar no celular via LAN/tunel;
# navegadores exigem contexto seguro. Em produção (Railway) o proprio PaaS
# termina o HTTPS de verdade na borda e fala HTTP puro com o container por
# dentro — por isso SSL_ENABLED=false fica setado la nas variaveis de ambiente.
# Ao acessar localmente pela primeira vez o navegador vai avisar que o
# certificado nao e confiavel: e esperado (autoassinado, so para testes
# locais) - toque em "Avancado" > "Continuar mesmo assim" / "Visitar site".
server.ssl.enabled=${SSL_ENABLED:true}
server.ssl.key-store=classpath:keystore.p12
server.ssl.key-store-password=retifica123
server.ssl.key-store-type=PKCS12
server.ssl.key-alias=retifica
